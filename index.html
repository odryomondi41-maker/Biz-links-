    <script>
      // Purge any legacy cached service workers or storage keys so Odry Studio always renders fresh
      (function () {
        try {
          var purgedKey = 'odry_studio_v2_cache_purged';
          Object.keys(localStorage).forEach(function (k) {
            if (k.toLowerCase().indexOf('bizlinks') !== -1) {
              localStorage.removeItem(k);
            }
          });
          if ('caches' in window) {
            caches.keys().then(function (names) {
              names.forEach(function (name) {
                if (name.indexOf('odry-studio-v2') === -1) {
                  caches.delete(name);
                }
              });
            });
          }
          if ('serviceWorker' in navigator && !sessionStorage.getItem(purgedKey)) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              var unregisteredAny = false;
              Promise.all(
                regs.map(function (reg) {
                  unregisteredAny = true;
                  return reg.unregister();
                })
              ).then(function () {
                sessionStorage.setItem(purgedKey, '1');
                if (unregisteredAny) {
                  window.location.reload();
                }
              });
            });
          }
        } catch (e) {}
      })();
    </script>
